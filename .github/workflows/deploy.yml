name: Deploy to Github Pages

on: workflow_dispatch

permissions:
  contents: read
  pages: write 
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - shell: bash
        working-directory: breakout
        run: |
          ./web-ci.sh

          cp -r ./web ../site/breakout

      - shell: bash
        working-directory: obby-2
        run: |
          ./web-ci.sh

          cp -r ./web ../site/obby-2

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment

